name: Sprint 1 Integration
on:
  push:
    branches: [develop]
    paths:
      - 'db/**'
      - 'lib/auth*'
      - 'lib/security/**'
      - 'proxy.ts'
      - 'app/sign-in/**'
      - 'lib/db/**'
      - 'lib/groups/**'
      - 'components/groups/**'
      - 'app/api/invites/**'
      - 'lib/expenses/**'
      - 'lib/debts/**'
      - 'lib/settlements/**'
      - 'lib/settlement-cycles/**'
      - 'lib/recurring/**'
      - 'app/api/internal/**'
      - 'scripts/sc010-restore-drill.sh'
      - 'scripts/rr003-ops-monitor.mjs'
      - 'lib/notifications/**'
      - 'app/api/groups/**'
      - 'app/api/debts/**'
      - 'app/api/settlements/**'
      - 'app/api/notifications/**'
      - 'app/api/push/**'
      - 'components/settlements/**'
      - 'components/notifications/**'
      - 'components/expenses/**'
      - 'tests/*.integration.mjs'
      - 'tests/*.smoke.mjs'
      - 'tests/helpers/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sprint1-integration.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'lib/auth*'
      - 'lib/security/**'
      - 'proxy.ts'
      - 'app/sign-in/**'
      - 'lib/db/**'
      - 'lib/groups/**'
      - 'components/groups/**'
      - 'app/api/invites/**'
      - 'lib/expenses/**'
      - 'lib/debts/**'
      - 'lib/settlements/**'
      - 'lib/settlement-cycles/**'
      - 'lib/recurring/**'
      - 'app/api/internal/**'
      - 'scripts/sc010-restore-drill.sh'
      - 'scripts/rr003-ops-monitor.mjs'
      - 'lib/notifications/**'
      - 'app/api/groups/**'
      - 'app/api/debts/**'
      - 'app/api/settlements/**'
      - 'app/api/notifications/**'
      - 'app/api/push/**'
      - 'components/settlements/**'
      - 'components/notifications/**'
      - 'components/expenses/**'
      - 'tests/*.integration.mjs'
      - 'tests/*.smoke.mjs'
      - 'tests/helpers/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sprint1-integration.yml'
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: group_expense
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/group_expense
      BETTER_AUTH_SECRET: test-secret-for-ci-not-used-in-production-12345
      BETTER_AUTH_URL: http://localhost:3101
      # CI-only placeholder, never a production secret. Exercises Cron auth.
      CRON_SECRET: ci-cycle-metadata-throwaway-do-not-use-outside-tests
      # Legacy fixture bypasses require this exact disposable localhost URL + CI.
      # SC025's separate role/database test removes these flags and uses real policy.
      SC005_TEST_ONLY: isolated-pg17
      # BN-004 legacy fixtures (hosted writes require operator + group opt-ins).
      BN004_TEST_ONLY: isolated-pg17
      # BN-006 legacy residual fixture bypass.
      BN006_TEST_ONLY: isolated-pg17
      # SC-007 reconciliation/concurrency tests may run ONLY in disposable PG17.
      SC007_TEST_ONLY: isolated-pg17
      # SC-009 daily reminders are exercised only against disposable PG17.
      SC009_TEST_ONLY: isolated-pg17
      # SC-010 logical restore drill only on the disposable GitHub Actions PG17.
      SC010_TEST_ONLY: isolated-pg17
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:finance:audit
      - run: pnpm build
      - run: pnpm test:http
      - run: pnpm test:finance:audit
      - name: SC-010 disposable logical backup and restore drill
        run: bash scripts/sc010-restore-drill.sh
